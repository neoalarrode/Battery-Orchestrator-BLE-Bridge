discover:
  name: Buscar baterías por Bluetooth
  description: >-
    Devuelve los dispositivos de la marca indicada vistos ahora mismo por
    Bluetooth (incluye los vistos a través de un ESPHome Bluetooth Proxy),
    sin conectar a ninguno todavía — solo lee los anuncios BLE que Home
    Assistant ya está escuchando.
  fields:
    brand:
      required: false
      example: "ecoflow"
      default: "ecoflow"
      selector:
        text:

get_state:
  name: Leer estado de una batería
  description: >-
    Conecta (si hace falta) y devuelve el último estado conocido de una
    batería por Bluetooth — SOC, potencia y estado de las tareas de
    carga/descarga (los campos exactos dependen de la marca).
  fields:
    brand:
      required: false
      default: "ecoflow"
      selector:
        text:
    address:
      required: true
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    credentials:
      required: true
      description: >-
        Objeto con lo que esa marca necesite para el pairing — para
        EcoFlow: {"user_id": "..."} (el userId numérico de la cuenta, no
        la contraseña).
      selector:
        object:

set_charging_task:
  name: Controlar la tarea de carga de una batería
  description: >-
    Activa/desactiva la tarea de carga programada y/o ajusta su límite de
    potencia desde red y su SOC objetivo. Los campos que no se indiquen no
    se tocan.
  fields:
    brand:
      required: false
      default: "ecoflow"
      selector:
        text:
    address:
      required: true
      selector:
        text:
    credentials:
      required: true
      selector:
        object:
    enable:
      required: false
      selector:
        boolean:
    power_limit_w:
      required: false
      selector:
        number:
          min: 0
          max: 10000
          unit_of_measurement: W
    target_soc:
      required: false
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

set_discharging_task:
  name: Controlar la tarea de descarga de una batería
  description: >-
    Activa/desactiva la tarea de descarga programada y/o ajusta su límite
    de potencia. Los campos que no se indiquen no se tocan.
  fields:
    brand:
      required: false
      default: "ecoflow"
      selector:
        text:
    address:
      required: true
      selector:
        text:
    credentials:
      required: true
      selector:
        object:
    enable:
      required: false
      selector:
        boolean:
    power_limit_w:
      required: false
      selector:
        number:
          min: 0
          max: 10000
          unit_of_measurement: W

set_backup_reserve:
  name: Reserva de emergencia
  description: >-
    Ajusta el porcentaje de SOC que la batería se guarda como colchón ante
    un corte de red.
  fields:
    brand:
      required: false
      default: "ecoflow"
      selector:
        text:
    address:
      required: true
      selector:
        text:
    credentials:
      required: true
      selector:
        object:
    pct:
      required: true
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

set_feed_grid:
  name: Vertido a red
  description: Activa o desactiva el vertido de excedente a la red eléctrica.
  fields:
    brand:
      required: false
      default: "ecoflow"
      selector:
        text:
    address:
      required: true
      selector:
        text:
    credentials:
      required: true
      selector:
        object:
    enable:
      required: true
      selector:
        boolean:

set_outlet:
  name: Salida AC
  description: >-
    Activa o desactiva una de las salidas AC independientes del equipo
    (solo modelos con más de una, p. ej. STREAM AC Pro).
  fields:
    brand:
      required: false
      default: "ecoflow"
      selector:
        text:
    address:
      required: true
      selector:
        text:
    credentials:
      required: true
      selector:
        object:
    outlet:
      required: true
      selector:
        number:
          min: 1
          max: 2
          step: 1
    enable:
      required: true
      selector:
        boolean:

set_grid_import_limit:
  name: Límite de importación de red
  description: >-
    Ajusta el límite de potencia que el equipo puede tomar de la red para
    cargar.
  fields:
    brand:
      required: false
      default: "ecoflow"
      selector:
        text:
    address:
      required: true
      selector:
        text:
    credentials:
      required: true
      selector:
        object:
    watts:
      required: true
      selector:
        number:
          min: 0
          max: 10000
          unit_of_measurement: W

disconnect:
  name: Desconectar una batería
  description: Cierra la conexión BLE con un dispositivo, si estaba abierta.
  fields:
    brand:
      required: false
      default: "ecoflow"
      selector:
        text:
    address:
      required: true
      selector:
        text:
    credentials:
      required: false
      selector:
        object:
